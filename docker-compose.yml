version: "3.8"

services:
  localstack:
    image: localstack/localstack:3.8.0
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"  # external services port range
    environment:
      - DEBUG=${DEBUG:-0}
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./localstack-init:/etc/localstack/init/ready.d"

  worker:
    # Real worker entrypoint: backend-nestjs/src/worker.main.ts, a NestJS
    # application context (no HTTP server) that processes the BullMQ
    # `materials-queue` job queue — see
    # backend-nestjs/src/materials/materials.module.ts. This previously built
    # `./worker-fastapi`, a Python/FastAPI + AWS SQS worker that does not exist
    # anywhere in this repo; this codebase queues with BullMQ/Redis, not SQS.
    #
    # No Dockerfile exists yet for backend-nestjs (none anywhere in this repo —
    # CI only runs `npm run build`, never a container build; see
    # .github/workflows/ci.yml). This block documents the correct context,
    # command, and environment for when one is added. `docker compose build`
    # will fail until a Dockerfile exists; `docker compose config` (schema
    # validation only) still passes.
    build:
      context: ./backend-nestjs
      dockerfile: Dockerfile
    command: ["node", "dist/worker.main"]
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      # Keeps the PDF-generation processor OUT of any API replica (see
      # materials.module.ts) and, since env.validation.ts, is required
      # whenever NODE_ENV=production.
      - PROCESS_ROLE=worker
      - JWT_SECRET=${JWT_SECRET}
      - DB_HOST=${DB_HOST:-localhost}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-odiseo}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASS=${DB_PASS:-postgres}
      # The same Redis this compose already runs, not the removed SQS/LocalStack
      # queue wiring.
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis

  redis:
    image: redis:7.2-alpine
    ports:
      - "127.0.0.1:6380:6379"
